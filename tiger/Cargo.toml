[package]
name = "tiger"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
egglog = { git = "https://github.com/egraphs-good/egglog-experimental", rev = "b14ef1d", package = "egglog-experimental" }
indexmap = "2.0"
rand_mt = { version = "6.0", default-features = false }
rustc-hash = "1.1"

[features]
default = []
# Enables the invariant checks behind `debug_assert_tiger!` (mirrors the C++ -DDEBUG build).
debug = []
